<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIPC — Portail Interactif de Physique-Chimie</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The splash below paints this emblem before the bundle has even parsed, and the
         landing screen shows it at 280px straight after. Preloaded so it races the module
         script rather than queueing behind it — the mark is the one thing the opening
         cannot fake. -->
    <link rel="preload" as="image" href="/pipc-badge.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pipc-fast: 120ms;
        --pipc-base: 220ms;
        --pipc-slow: 380ms;
        --pipc-ease: cubic-bezier(.2, .8, .2, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      h1, h2, h3, h4, .font-heading {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      }

      /* ---- Opening animation. Injected by the inline script below (so it never reaches
         crawlers or no-JS visitors), removed by App.vue on mount. ---- */
      #pipc-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(165deg, #F6FBF7, #D8EFE0);
        transition: opacity 380ms cubic-bezier(.2, .8, .2, 1);
        /* Failsafe: App.vue removes this node at ~1.4s, but if the bundle never loads
           nothing would — and a fixed overlay would then hide the prerendered content
           that a no-JS visitor can otherwise still read. CSS alone gets them out. */
        animation: pipc-failsafe 1ms 6000ms forwards;
      }
      @keyframes pipc-failsafe {
        to { opacity: 0; visibility: hidden; }
      }
      #pipc-splash.pipc-dark {
        background: linear-gradient(165deg, #16241C, #0B120E);
      }
      #pipc-splash.pipc-out { opacity: 0; }
      /* No `forwards` and no zeroed base: the resting state is the visible one, and the
         animation only describes where the mark comes FROM. App.vue clears this animation
         before flying the mark to its destination, and a filled animation would snap the
         emblem back to opacity 0 the instant it did. */
      #pipc-splash-mark {
        transform-origin: center;
        animation: pipc-mark-in 620ms cubic-bezier(.2, .8, .2, 1);
      }
      @keyframes pipc-mark-in {
        from { opacity: 0; transform: scale(.82); }
      }
      #pipc-splash .pipc-word {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -.5px;
        color: #101A14;
        opacity: 0;
        animation: pipc-rise 400ms 1000ms cubic-bezier(.2, .8, .2, 1) forwards;
      }
      #pipc-splash.pipc-dark .pipc-word { color: #E8F0EA; }
      #pipc-splash .pipc-sub {
        font-size: 9px;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: #14528C;
        opacity: 0;
        animation: pipc-rise 400ms 1120ms cubic-bezier(.2, .8, .2, 1) forwards;
      }
      #pipc-splash.pipc-dark .pipc-sub { color: #7FB6E8; }
      @keyframes pipc-rise {
        from { opacity: 0; transform: translateY(9px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>

  </head>
  <body>
    <script>
      // Runs before the bundle loads, so the splash paints in ~50ms instead of after Vue
      // mounts. Injected rather than written statically into the shell: the ~653
      // prerendered pages must reach crawlers and no-JS visitors uncovered. Mirrors
      // src/lib/intro.ts — keep the two in step.
      //
      // It lives at the top of <body>, NOT in <head>: from <head> there is no body to
      // append to yet, and deferring to DOMContentLoaded puts the injection AFTER the
      // deferred module script — so Vue would mount, find no splash to dismiss, and the
      // splash would then appear with nothing left to remove it.
      (function () {
        try {
          if (sessionStorage.getItem("pipc:intro-played") !== null) return;
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          sessionStorage.setItem("pipc:intro-played", "1");
        } catch (e) {
          return;
        }
        var dark = false;
        try {
          dark = localStorage.getItem("pipc:theme") === "dark";
        } catch (e) {}
        var el = document.createElement("div");
        el.id = "pipc-splash";
        if (dark) el.className = "pipc-dark";
        el.setAttribute("aria-hidden", "true");
        // The real emblem, not a traced approximation of it — the same file config.ts
        // exports as BRAND_BADGE and the header, footer and landing all wear. Preloaded in
        // <head>, so by the time this runs it is normally already in cache.
        //
        // The wordmark below stays: at 96px the badge's arched lettering is texture rather
        // than words, exactly as in the app bar, so the name still has to be spelled out.
        el.innerHTML =
          '<img id="pipc-splash-mark" src="/pipc-badge.png" width="96" height="96" alt="" />' +
          '<div class="pipc-word">PIPC</div>' +
          '<div class="pipc-sub">Physique-Chimie</div>';
        document.body.appendChild(el);
        // When the animation actually started. App.vue holds the splash for the
        // remainder of its duration measured from here, so a slow bundle cannot stretch
        // a 1.4s intro into a 3s one.
        window.__pipcSplashAt = Date.now();
      })();
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
