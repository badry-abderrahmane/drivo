<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PIPC">
  <!-- Brand mark: the header's π tile (src/App.vue), inverted to a solid fill so it stays
       legible at 16px. Geometric paths, not text — a favicon cannot rely on a webfont.
       Every edge sits on a multiple of 4, so at the 16px tab size the bar and both legs
       rasterise onto whole pixels instead of blurring across two. -->
  <rect width="64" height="64" rx="14" fill="#006B5F"/>
  <g fill="#FFFFFF">
    <rect x="12" y="16" width="40" height="8" rx="2"/>
    <rect x="20" y="20" width="8" height="28" rx="2"/>
    <rect x="36" y="20" width="8" height="28" rx="2"/>
  </g>
</svg>
